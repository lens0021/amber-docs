name: Prerelease check

on:
  push:
    branches:
      - main
    paths:
      - docs/*/getting_started/new_changes.md
      - docs/*/getting_started/whats_new.md
      - docs/*/getting_started/migration_guide.md
  workflow_dispatch:  # Allows manual dispatch

jobs:
  get-commits:
    name: Get commit subjects
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.get-commits-step.outputs.subjects }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: amber-lang/amber
          fetch-depth: 0
          ref: staging
      - id: get-commits-step
        run: |
          LATEST_TAG="$(git tag --sort=version:refname | grep -v nightly | tail --lines=1)"
          echo latest tag is $LATEST_TAG
          SUBJECTS="$(git log "$LATEST_TAG..staging" --oneline --format=%s)"
          echo "--- Subjects ---"
          echo "$SUBJECTS"
          echo "--- End of Subjects ---"
          {
            echo 'subjects<<EOF'
            echo "$SUBJECTS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  review:
    name: Check What's new
    runs-on: ubuntu-latest
    needs: get-commits
    outputs:
      smallest_missing_pr: ${{ steps.review-docs-step.outputs.smallest_missing_pr }}
    env:
      COMMITS: ${{ needs.get-commits.outputs.subjects }}
    steps:
      - uses: actions/checkout@v5
      - name: Print COMMITS
        run: |
          echo "Received COMMITS: $COMMITS"
      - id: review-docs-step
        name: Review docs
        run: |
          shopt -s globstar
          SMALLEST_MISSING_PR=""
          while IFS= read -r COMMIT; do
            PULL_NUM="$(echo "$COMMIT" | rev | cut -d'#' -f1 | rev | cut -d')' -f1)"
            if ! grep --quiet --extended-regexp "#$PULL_NUM\b|https://github.com/amber-lang/amber/pull/#$PULL_NUM\b" docs/**/*.md; then
              echo "::warning title=Docs for upcoming release::Missing \"$COMMIT\""
              if [ -z "$SMALLEST_MISSING_PR" ] || [ "$PULL_NUM" -lt "$SMALLEST_MISSING_PR" ]; then
                SMALLEST_MISSING_PR="$PULL_NUM"
              fi
            fi
          done <<< "$COMMITS"

          if [ -n "$SMALLEST_MISSING_PR" ]; then
            echo "smallest_missing_pr=$SMALLEST_MISSING_PR" >> "$GITHUB_OUTPUT"
          fi

  create-pr:
    name: Update Docs and Create PR
    runs-on: ubuntu-latest
    needs: review
    if: ${{ needs.review.outputs.smallest_missing_pr != '' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      MODEL: qwen2.5:7b
      OLLAMA_TIMEOUT: "10800"
    steps:
      - name: Set OLLAMA_MODELS
        run: echo "OLLAMA_MODELS=${{ runner.temp }}/ollama/models" >> $GITHUB_ENV
      - uses: actions/checkout@v5
      - name: Checkout amber repository
        uses: actions/checkout@v5
        with:
          repository: amber-lang/amber
          path: amber-repo
          fetch-depth: 0
      - name: Get latest docs version and content
        id: get-docs-content
        run: |
          LATEST_DOCS_VERSION_DIR=$(ls -d docs/*/ | sort -V | tail -n 1)
          echo "Latest docs version directory: $LATEST_DOCS_VERSION_DIR"
          echo "LATEST_DOCS_VERSION_DIR=$LATEST_DOCS_VERSION_DIR" >> "$GITHUB_ENV"
          echo "DOCS_WORKDIR=$LATEST_DOCS_VERSION_DIR" >> "$GITHUB_ENV"
      - name: Prepare goose workspace
        run: |
          mkdir -p "${{ env.DOCS_WORKDIR }}/.goose"
      - name: Get PR info
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.smallest_missing_pr }}
        run: |
          echo "Attempting to get info for PR #$PR_NUMBER from amber-lang/amber"
          mkdir -p "${{ env.DOCS_WORKDIR }}/.goose"

          # Save PR metadata
          gh pr view "$PR_NUMBER" --repo amber-lang/amber > "${{ env.DOCS_WORKDIR }}/.goose/pr_view_output.txt"

          # Get commit SHAs for goose to use with git commands
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo amber-lang/amber --json headRefOid --jq .headRefOid)
          BASE_SHA=$(gh pr view "$PR_NUMBER" --repo amber-lang/amber --json baseRefOid --jq .baseRefOid)

          echo "PR head commit: $HEAD_SHA"
          echo "PR base commit: $BASE_SHA"
          echo "PR_HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV
          echo "PR_BASE_SHA=$BASE_SHA" >> $GITHUB_ENV
      - name: Get ollama version
        id: version-ollama
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/ollama/ollama/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT
      - name: Cache ollama
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: /usr/local/ollama
          key: ollama-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}
      - name: Install ollama
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Prepare Ollama models dir
        run: mkdir -p "$OLLAMA_MODELS"
      - name: Cache ollama models
        id: cache-ollama-models
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}-${{ env.MODEL }}
          restore-keys: |
            ollama-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}-
            ollama-models-${{ runner.os }}-${{ runner.arch }}-
      - name: Install goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Start Ollama
        run: |
          mkdir -p logs
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ulimit -v 4194304  # 4GB virtual memory limit
          nohup ollama serve > logs/ollama.log 2>&1 &
          OLLAMA_PID=$!
          echo "Ollama PID: $OLLAMA_PID"
          echo "OLLAMA_PID=$OLLAMA_PID" >> $GITHUB_ENV
          echo "Waiting for Ollama..."
          until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 1; done
      - name: Pull model
        run: |
          if ! ollama list | awk '{print $1}' | grep -qx "${{ env.MODEL }}"; then
            ollama pull "${{ env.MODEL }}"
          fi
      - name: Run goose
        run: |
          mkdir -p .goose

          # Phase 1: discover target docs files and per-file change points
          cat > .goose/discover_targets.txt <<INST_EOF
          CONTEXT:
          - PR #${{ needs.review.outputs.smallest_missing_pr }}
          - PR metadata: .goose/pr_view_output.txt
          - Amber repo at: ../../amber-repo (commits: $PR_BASE_SHA..$PR_HEAD_SHA)
          - Docs workspace root: current working directory (docs version directory)

          TASK:
          1. Read .goose/pr_view_output.txt to understand the PR
          2. Check what files changed: git -C ../../amber-repo diff --name-status $PR_BASE_SHA..$PR_HEAD_SHA
          3. Decide which markdown docs files under the current docs workspace should be updated, and list concrete change points per file.

          REQUIREMENTS:
          - Do not edit any file in this phase.
          - Do not ask follow-up questions.
          - Output must be exactly:
            BEGIN_PLAN
            FILE: <relative/path/to/file.md>
            - <concrete change point>
            - <concrete change point>
            FILE: <relative/path/to/another_file.md>
            - <concrete change point>
            END_PLAN
          - Include only files that need edits.
          - Each listed file must include at least one change-point bullet.
          - Keep each change point short and actionable.
          - FILE paths must be relative to docs workspace and end with .md
          - If no docs updates are needed, output only BEGIN_PLAN and END_PLAN lines.
          INST_EOF

          DISCOVER_LOG=".goose/discover.log"
          set +e
          goose run \
            --provider ollama \
            --model ${{ env.MODEL }} \
            --with-builtin developer \
            -i .goose/discover_targets.txt \
            --no-session \
            --max-turns 50 \
            --debug \
            --output-format text 2>&1 | tee "$DISCOVER_LOG"
          GOOSE_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$GOOSE_EXIT" -ne 0 ]; then
            echo "goose (discover phase) failed with exit code $GOOSE_EXIT"
            echo "::group::Goose logs"
            tail -n 200 "$DISCOVER_LOG" || true
            echo "::endgroup::"
            echo "::group::Ollama logs"
            tail -n 100 "$GITHUB_WORKSPACE/logs/ollama.log" || true
            echo "::endgroup::"
            echo "::group::Ollama status"
            ps aux | grep ollama || true
            echo "::endgroup::"
            exit 1
          fi

          awk '/^BEGIN_PLAN$/,/^END_PLAN$/' "$DISCOVER_LOG" | sed '1d;$d' > .goose/plan_raw.txt

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          : > .goose/tasks.tsv
          current=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^FILE:[[:space:]]*(.*)$ ]]; then
              current="$(trim "${BASH_REMATCH[1]}")"
              continue
            fi

            if [[ "$line" =~ ^[[:space:]]*-[[:space:]]+(.+)$ ]]; then
              point="$(trim "${BASH_REMATCH[1]}")"
              if [[ -n "$current" ]] \
                && [[ "$current" == *.md ]] \
                && [[ "$current" != /* ]] \
                && [[ "$current" != *".."* ]] \
                && [ -n "$point" ]; then
                printf '%s\t%s\n' "$current" "$point" >> .goose/tasks.tsv
              fi
            fi
          done < .goose/plan_raw.txt

          echo "::group::Goose tasks (file<TAB>point)"
          cat .goose/tasks.tsv || true
          echo "::endgroup::"

          if [ ! -s .goose/tasks.tsv ]; then
            echo "No valid (file, change-point) tasks discovered by goose."
            echo "::group::Goose logs"
            tail -n 200 "$DISCOVER_LOG" || true
            echo "::endgroup::"
            exit 1
          fi

          # Phase 2: run goose once per (target file, change point)
          CHANGED_ANY=0
          TASK_INDEX=0
          while IFS=$'\t' read -r TARGET_FILE CHANGE_POINT; do
            [ -n "$TARGET_FILE" ] || continue
            [ -n "$CHANGE_POINT" ] || continue
            TASK_INDEX=$((TASK_INDEX + 1))
            TARGET_BASENAME="$(basename "$TARGET_FILE")"
            TARGET_LOG=".goose/edit_${TASK_INDEX}_${TARGET_BASENAME}.log"
            TARGET_INST=".goose/edit_${TASK_INDEX}_${TARGET_BASENAME}.txt"
            if [ -f "$TARGET_FILE" ]; then
              BEFORE_HASH="$(sha256sum "$TARGET_FILE" | awk '{print $1}')"
            else
              BEFORE_HASH=""
            fi

            cat > "$TARGET_INST" <<INST_EOF
          CONTEXT:
          - PR #${{ needs.review.outputs.smallest_missing_pr }}
          - PR metadata: .goose/pr_view_output.txt
          - Amber repo at: ../../amber-repo (commits: $PR_BASE_SHA..$PR_HEAD_SHA)
          - Target doc file: $TARGET_FILE
          - Target change point: $CHANGE_POINT

          TASK:
          1. Read .goose/pr_view_output.txt and changed files from amber repo
          2. Apply ONLY the target change point to ONLY $TARGET_FILE

          REQUIREMENTS:
          - Use text_editor to view and str_replace files
          - Add <!-- PR #${{ needs.review.outputs.smallest_missing_pr }} --> near changes
          - Do not modify any other files
          - Do not ask follow-up questions
          - If no change is needed for this specific change point, print exactly: NO_CHANGE
          - If you need code details, use: git -C ../../amber-repo show $PR_HEAD_SHA:path/to/file
          INST_EOF

            set +e
            goose run \
              --provider ollama \
              --model ${{ env.MODEL }} \
              --with-builtin developer \
              -i "$TARGET_INST" \
              --no-session \
              --max-turns 50 \
              --debug \
              --output-format text 2>&1 | tee "$TARGET_LOG"
            GOOSE_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$GOOSE_EXIT" -ne 0 ]; then
              echo "goose (edit phase) failed for $TARGET_FILE [$CHANGE_POINT] with exit code $GOOSE_EXIT"
              echo "::group::Goose logs: $TARGET_FILE [$CHANGE_POINT]"
              tail -n 200 "$TARGET_LOG" || true
              echo "::endgroup::"
              exit 1
            fi

            if [ -f "$TARGET_FILE" ]; then
              AFTER_HASH="$(sha256sum "$TARGET_FILE" | awk '{print $1}')"
            else
              AFTER_HASH=""
            fi
            if [ "$BEFORE_HASH" = "$AFTER_HASH" ]; then
              echo "No edits produced for $TARGET_FILE [$CHANGE_POINT]"
            else
              CHANGED_ANY=1
              echo "Edits produced for $TARGET_FILE [$CHANGE_POINT]"
            fi
          done < .goose/tasks.tsv

          if [ "$CHANGED_ANY" -eq 0 ]; then
            echo "goose completed but did not produce changes under $DOCS_WORKDIR"
            echo "::group::Ollama logs"
            tail -n 100 "$GITHUB_WORKSPACE/logs/ollama.log" || true
            echo "::endgroup::"
            echo "::group::Ollama status"
            ps aux | grep ollama || true
            echo "::endgroup::"
            exit 1
          fi
        working-directory: ${{ env.DOCS_WORKDIR }}
        env:
          GOOSE_PROVIDER: ollama
          OLLAMA_HOST: http://localhost:11434
      - name: Clean goose task state
        run: |
          rm -rf "${{ env.DOCS_WORKDIR }}/.goose"
          git checkout -- .github 2>/dev/null || true
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: "Docs: Automated update for PR ${{ needs.review.outputs.smallest_missing_pr }}"
          title: "Docs: Automated update for PR ${{ needs.review.outputs.smallest_missing_pr }}"
          body: |
            Automated documentation update based on PR ${{ needs.review.outputs.smallest_missing_pr }} from amber-lang/amber.
            This PR was generated by the prerelease check workflow.
          branch: automated-docs-update-${{ needs.review.outputs.smallest_missing_pr }}
          base: main
