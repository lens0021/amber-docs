name: Prerelease check

on:
  push:
    branches:
      - main
    paths:
      - docs/*/getting_started/new_changes.md
      - docs/*/getting_started/whats_new.md
      - docs/*/getting_started/migration_guide.md
  workflow_dispatch:  # Allows manual dispatch

jobs:
  get-commits:
    name: Get commit subjects
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.get-commits-step.outputs.subjects }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: amber-lang/amber
          fetch-depth: 0
          ref: staging
      - id: get-commits-step
        run: |
          LATEST_TAG="$(git tag --sort=version:refname | grep -v nightly | tail --lines=1)"
          echo latest tag is $LATEST_TAG
          SUBJECTS="$(git log "$LATEST_TAG..staging" --oneline --format=%s)"
          echo "--- Subjects ---"
          echo "$SUBJECTS"
          echo "--- End of Subjects ---"
          {
            echo 'subjects<<EOF'
            echo "$SUBJECTS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  review:
    name: Check What's new
    runs-on: ubuntu-latest
    needs: get-commits
    outputs:
      smallest_missing_pr: ${{ steps.review-docs-step.outputs.smallest_missing_pr }}
    env:
      COMMITS: ${{ needs.get-commits.outputs.subjects }}
    steps:
      - uses: actions/checkout@v5
      - name: Print COMMITS
        run: |
          echo "Received COMMITS: $COMMITS"
      - id: review-docs-step
        name: Review docs
        run: |
          shopt -s globstar
          SMALLEST_MISSING_PR=""
          while IFS= read -r COMMIT; do
            PULL_NUM="$(echo "$COMMIT" | rev | cut -d'#' -f1 | rev | cut -d')' -f1)"
            if ! grep --quiet --extended-regexp "#$PULL_NUM\b|https://github.com/amber-lang/amber/pull/#$PULL_NUM\b" docs/**/*.md; then
              echo "::warning title=Docs for upcoming release::Missing \"$COMMIT\""
              if [ -z "$SMALLEST_MISSING_PR" ] || [ "$PULL_NUM" -lt "$SMALLEST_MISSING_PR" ]; then
                SMALLEST_MISSING_PR="$PULL_NUM"
              fi
            fi
          done <<< "$COMMITS"

          if [ -n "$SMALLEST_MISSING_PR" ]; then
            echo "smallest_missing_pr=$SMALLEST_MISSING_PR" >> "$GITHUB_OUTPUT"
          fi

  create-pr:
    name: Update Docs and Create PR
    runs-on: ubuntu-latest
    needs: review
    if: ${{ needs.review.outputs.smallest_missing_pr != '' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      MODEL: qwen2.5-coder:3b
    steps:
      - name: Set OLLAMA_MODELS
        run: echo "OLLAMA_MODELS=${{ runner.temp }}/ollama/models" >> $GITHUB_ENV
      - uses: actions/checkout@v5
      - name: Get latest docs version and content
        id: get-docs-content
        run: |
          LATEST_DOCS_VERSION_DIR=$(ls -d docs/*/ | sort -V | tail -n 1)
          echo "Latest docs version directory: $LATEST_DOCS_VERSION_DIR"
          echo "LATEST_DOCS_VERSION_DIR=$LATEST_DOCS_VERSION_DIR" >> "$GITHUB_ENV"
          echo "NANOCODER_WORKDIR=$LATEST_DOCS_VERSION_DIR" >> "$GITHUB_ENV"
      - name: Prepare goose workspace
        run: |
          mkdir -p "${{ env.NANOCODER_WORKDIR }}/.goose"
      - name: Get PR info
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.review.outputs.smallest_missing_pr }}
        run: |
          echo "Attempting to get info for PR #$PR_NUMBER from amber-lang/amber"
          mkdir -p "${{ env.NANOCODER_WORKDIR }}/.goose"
          gh pr view "$PR_NUMBER" --repo amber-lang/amber > "${{ env.NANOCODER_WORKDIR }}/.goose/pr_view_output.txt"
          gh pr diff "$PR_NUMBER" --repo amber-lang/amber > "${{ env.NANOCODER_WORKDIR }}/.goose/pr_diff_output.txt"
      - name: Get ollama version
        id: version-ollama
        shell: bash
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/ollama/ollama/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT
      - name: Cache ollama
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: /usr/local/ollama
          key: ollama-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}
      - name: Install ollama
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Prepare Ollama models dir
        run: mkdir -p "$OLLAMA_MODELS"
      - name: Cache ollama models
        id: cache-ollama-models
        uses: actions/cache@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}-${{ env.MODEL }}
          restore-keys: |
            ollama-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.version-ollama.outputs.version }}-
            ollama-models-${{ runner.os }}-${{ runner.arch }}-
      - name: Install goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Start Ollama
        run: |
          ollama serve &
          echo "Waiting for Ollama..."
          until curl -s http://localhost:11434/api/tags > /dev/null; do sleep 1; done
      - name: Pull model
        run: |
          if ! ollama list | awk '{print $1}' | grep -qx "${{ env.MODEL }}"; then
            ollama pull "${{ env.MODEL }}"
          fi
      - name: Run goose
        run: |
          mkdir -p .goose

          # Create instruction file
          cat > .goose/instructions.txt <<'INST_EOF'
          The following Pull Request (PR) information is available:
          PR View Output: .goose/pr_view_output.txt
          PR Diff Output: .goose/pr_diff_output.txt

          You may update any file under the current working directory as needed to include the information from the PR.
          Add the new content directly to the file(s).
          Ensure you include a comment referencing the PR number, like: "<!-- PR #${{ needs.review.outputs.smallest_missing_pr }} -->".
          INST_EOF

          LOG_PATH=".goose/goose.log"
          set +e
          goose run \
            --provider ollama \
            --model ${{ env.MODEL }} \
            -i .goose/instructions.txt \
            --no-session \
            --max-turns 50 \
            --output-format text 2>&1 | tee "$LOG_PATH"
          GOOSE_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$GOOSE_EXIT" -ne 0 ]; then
            echo "goose failed with exit code $GOOSE_EXIT"
            echo "goose logs:"
            tail -n 200 "$LOG_PATH" || true
            exit 1
          fi

          if git -C "$GITHUB_WORKSPACE" diff --quiet -- "$NANOCODER_WORKDIR"; then
            echo "goose did not produce changes under $NANOCODER_WORKDIR"
            exit 1
          fi
        working-directory: ${{ env.NANOCODER_WORKDIR }}
        env:
          GOOSE_PROVIDER: ollama
          OLLAMA_HOST: http://localhost:11434
      - name: Clean goose task state
        run: |
          rm -rf "${{ env.NANOCODER_WORKDIR }}/.goose"
          git checkout -- .github 2>/dev/null || true
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          commit-message: "Docs: Automated update for PR ${{ needs.review.outputs.smallest_missing_pr }}"
          title: "Docs: Automated update for PR ${{ needs.review.outputs.smallest_missing_pr }}"
          body: |
            Automated documentation update based on PR ${{ needs.review.outputs.smallest_missing_pr }} from amber-lang/amber.
            This PR was generated by the prerelease check workflow.
          branch: automated-docs-update-${{ needs.review.outputs.smallest_missing_pr }}
          base: main
